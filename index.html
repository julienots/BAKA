<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Le Manteau Rouge</title>
<link rel="stylesheet" href="./src/ui/style.css">
</head>
<body>
<div id="app"></div>
<div id="ui">
  <!-- Menu principal -->
  <section id="menu" class="screen">
    <div class="title"><span class="t1">LE MANTEAU</span><span class="t2">ROUGE</span></div>
    <nav>
      <button id="m_play">Jouer</button>
      <button id="m_continue">Continuer</button>
      <button id="m_chapters">Chapitres</button>
      <button id="m_options">Options</button>
    </nav>
    <div class="hint" id="m_hint"></div>
  </section>
  <section id="chapters" class="screen hidden"><h2>Chapitres</h2><div id="chapList"></div><button class="back">Retour</button></section>
  <section id="options" class="screen hidden">
    <h2>Options</h2>
    <label>Qualité graphique <select id="o_quality"><option value="low">Basse</option><option value="medium">Moyenne</option><option value="high">Élevée</option></select></label>
    <label>Luminosité <input id="o_bright" type="range" min="0.7" max="1.8" step="0.05"></label>
    <label>Effets de film (grain, vignette) <input id="o_film" type="checkbox"></label>
    <label>Volume général <input id="o_master" type="range" min="0" max="1" step="0.05"></label>
    <label>Musique <input id="o_music" type="range" min="0" max="1" step="0.05"></label>
    <label>Effets <input id="o_sfx" type="range" min="0" max="1" step="0.05"></label>
    <label>Vibrations <input id="o_vib" type="checkbox"></label>
    <label>Taille des contrôles <input id="o_ctrl" type="range" min="0.7" max="1.4" step="0.05"></label>
    <button class="back">Retour</button>
  </section>
  <section id="pause" class="screen hidden">
    <h2>Pause</h2>
    <nav><button id="p_resume">Reprendre</button><button id="p_options">Options</button><button id="p_menu">Menu principal</button></nav>
  </section>
  <div id="titleCard" class="hidden"><div class="num"></div><div class="name"></div><div class="sub"></div></div>
  <div id="memory" class="hidden"><canvas width="512" height="384"></canvas></div>
  <div id="credits" class="hidden"></div>
  <div id="rotate" class="hidden"><div>⟳</div></div>
  <!-- Commandes tactiles -->
  <div id="touch" class="hidden">
    <div id="joyZone"></div>
    <div id="joyBase"><div id="joyKnob"></div></div>
    <button id="b_pause" class="tbtn small">II</button>
    <div id="btns">
      <button id="b_jump" class="tbtn big"><svg viewBox="0 0 24 24"><path d="M12 5l-6 7h4v7h4v-7h4z"/></svg></button>
      <button id="b_act" class="tbtn"><svg viewBox="0 0 24 24"><path d="M9 11V5a1.5 1.5 0 013 0v5-6a1.5 1.5 0 013 0v6-4a1.5 1.5 0 013 0v7c0 4-2.5 7-6 7s-5-1.5-7-5l-2-3.5a1.4 1.4 0 012.3-1.5L9 13"/></svg></button>
      <button id="b_power" class="tbtn power"><span id="powIcon"></span><i id="powCool"></i></button>
      <button id="b_swap" class="tbtn small">⇄</button>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
